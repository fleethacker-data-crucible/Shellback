.radar-svg {
  width: 100%;
  height: auto;
  display: block;
}
.radar-ring {
  stroke: #2b4463;
}
.radar-ring-4 {
  stroke: #3c5c82;
}
.radar-axis {
  stroke: #243a56;
  stroke-width: 1;
}
.radar-label {
  fill: #c7d7ea;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.02em;
  cursor: pointer;
}
.radar-label:hover, .radar-label:focus-visible {
  fill: #5cf1cb;
}
.radar-web {
  transition: d 0.4s ease, points 0.4s ease;
}
.radar-node {
  cursor: pointer;
  transition: r 0.25s ease;
}
.radar-node:hover {
  stroke: #ffffff;
}
.radar-center {
  fill: #dbe7f6;
  font-size: 20px;
  font-weight: 800;
}
.radar-subtitle {
  fill: #96aabd;
  font-size: 12px;
}
.radar-footnote {
  fill: #5f7690;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.16em;
}
.galaxy-svg {
  width: 100%;
  height: auto;
  display: block;
  background: radial-gradient(ellipse at center, #0e1a33 0%, #070e1c 70%);
  border-radius: 18px;
  touch-action: none;
  user-select: none;
}
.sky-link {
  stroke: #6e8cb5;
  stroke-width: 1.1;
  transition: stroke-opacity 0.2s ease, stroke-width 0.2s ease;
}
.sky-semantic {
  stroke: #e0ad79;
  stroke-dasharray: 4 4;
}
.sky-branch {
  stroke: #8fb4df;
}
.sky-confirmed {
  stroke: #8bd0be;
  stroke-width: 1.6;
}
.sky-skill-node {
  cursor: grab;
  outline: none;
}
.sky-skill-node:focus-visible circle:nth-child(2) {
  stroke: #ffffff;
  stroke-width: 2.4;
}
.galaxy-domain-label {
  fill: #9fb6d2;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  pointer-events: none;
}
.galaxy-domain-count {
  fill: #5cf1cb;
  font-size: 10px;
  font-weight: 700;
  pointer-events: none;
}
.sky-hover-tip {
  position: absolute;
  z-index: 5;
  max-width: 230px;
  pointer-events: none;
  border-radius: 10px;
  border: 1px solid #2d4664;
  background: rgba(9, 18, 33, 0.96);
  padding: 8px 10px;
  font-size: 12px;
  line-height: 1.4;
  box-shadow: 0 14px 30px -14px rgba(0, 0, 0, 0.8);
}
.sky-hover-tip strong {
  display: block;
  color: #f1f6ff;
}
.sky-hover-tip span {
  display: block;
  color: #96aabd;
  font-size: 11px;
}
.sky-hover-tip small {
  display: block;
  color: #bcd0e6;
  margin-top: 3px;
}
.orbit {
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(92, 241, 203, 0.25);
  animation: spin 28s linear infinite;
}
.orbit-b {
  animation-duration: 40s;
  animation-direction: reverse;
  border-color: rgba(103, 171, 255, 0.25);
}
.orbit-c {
  animation-duration: 56s;
  border-color: rgba(172, 145, 251, 0.25);
}
@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
.flash {
  transform: translateY(8px);
  opacity: 0;
  transition: opacity 0.25s ease, transform 0.25s ease;
}
.flash.show {
  transform: translateY(0);
  opacity: 1;
}
dialog::backdrop {
  background: rgba(3, 8, 18, 0.72);
  backdrop-filter: blur(2px);
